name: UI Foundation Integrity

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read
  pull-requests: read
  statuses: write

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Invalidate previous aggregate on this workflow attempt
        if: github.event_name == 'pull_request'
        run: node scripts/m5-aggregate-status.mjs invalidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check ELCEO UI foundation
        run: npm run check:ui-foundation

      - name: Verify complete frozen backend snapshot
        run: npm run verify:backend-handoff

      - name: Test integrity rejection cases
        run: npm run test:foundation
