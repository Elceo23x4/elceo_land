name: UI Foundation Integrity

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Check ELCEO UI foundation
        run: npm run check:ui-foundation

      - name: Verify complete frozen backend snapshot
        run: npm run verify:backend-handoff

      - name: Test integrity rejection cases
        run: npm run test:foundation
