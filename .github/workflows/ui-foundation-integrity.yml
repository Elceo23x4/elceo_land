name: UI Foundation Integrity

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check ELCEO UI foundation
        run: npm run check:ui-foundation

      - name: Verify materialized backend snapshot when present
        shell: bash
        run: |
          if [ -f docs/backend-contract/SNAPSHOT.json ]; then
            npm run verify:backend-handoff
          else
            echo "Backend snapshot not materialized in this checkout; SOURCE.json + sync protocol remain authoritative until synchronization is performed."
          fi
